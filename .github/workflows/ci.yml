name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The last upstream commit before the modernisation. tests/harness/golden/
  # was recorded from it; the legacy-harness job proves it still matches.
  LEGACY_COMMIT: df36bdd29d7293e5f3b2c9a08ef14434526dba59
  UV_VERSION: "0.11.32"

# Third-party actions are pinned by commit SHA (version in the comment).

jobs:
  removed-apis:
    name: No removed APIs in bumper/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: grep
        run: |
          if grep -rnE 'pkg_resources|hbmqtt|get_event_loop|datetime\.utcnow|loop=' bumper/; then
            echo "::error::removed or deprecated API found in bumper/"
            exit 1
          fi

  test:
    name: Unit tests + harness (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
      - name: Install (locked)
        run: uv sync --frozen
      - name: Unit tests (every DeprecationWarning is an error, not only Bumper's)
        run: uv run --frozen pytest tests -W error::DeprecationWarning -W error::PendingDeprecationWarning
      - name: Characterisation harness (modern profile)
        env:
          BUMPER_HARNESS_SERVER_WARNINGS: error
        run: uv run --frozen pytest tests/harness

  legacy-harness:
    name: Harness vs. the pre-port code (Python 3.9, legacy pins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the pre-port commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.LEGACY_COMMIT }}
          path: legacy
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Legacy environment
        run: |
          uv python install 3.9
          uv venv -p 3.9 .venv-legacy-harness
          uv pip install -p .venv-legacy-harness/bin/python -r legacy/requirements.txt \
            "setuptools<70" "pytest>=8.3,<8.4" "paho-mqtt>=2.1,<3"
      - name: Harness (legacy profile, current harness, legacy code)
        env:
          BUMPER_HARNESS_SRC: legacy
          BUMPER_HARNESS_PROFILE: legacy
        run: .venv-legacy-harness/bin/python -m pytest tests/harness

  docker:
    name: Docker image (amd64 + arm64), smoke test
    runs-on: ubuntu-latest
    needs: [removed-apis, test, legacy-harness]
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - name: Harness environment for the smoke test
        run: uv sync --frozen

      - name: Build for amd64 (smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: bumper:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (harness against the container, restart persistence)
        env:
          IMAGE: bumper:smoke
          SKIP_BUILD: "1"
          PYTHON: uv run --frozen python
        run: scripts/docker-smoke.sh

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/bumper
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=sha
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build amd64 + arm64 (push on tags and the default branch)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
