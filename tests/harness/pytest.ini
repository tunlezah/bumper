# The characterisation harness has its own configuration so that it runs the
# same way on Python 3.9 + the legacy pins and on the modern stack, without the
# unit-test plugins (pytest-asyncio, pytest-aiohttp, pytest-env). In the modern
# environment those plugins are installed for tests/, so they are disabled
# here by name (a no-op where they are not installed).
[pytest]
testpaths = .
addopts = -p no:cacheprovider -p no:asyncio -p no:aiohttp
